  <section style="margin-top:28px;display:grid;gap:24px;grid-template-columns:1fr">
    <div><h2 class="sec">Añadidos recientemente</h2><div class="grid books">${recientes.map(x=>bookCard(x.b,x.i)).join("")}</div></div>
    <div><h2 class="sec">Por género</h2>${(()=>{const gc=genreCounts();const mx=Math.max(...gc.map(x=>x[1]),1);return gc.map(([g,n])=>`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="color:var(--muted)">${esc(g)}</span><b style="font-family:var(--mono)">${n}</b></div><div style="height:10px;border-radius:99px;background:var(--soft);overflow:hidden"><div style="height:100%;width:${Math.round(n/mx*100)}%;border-radius:99px;background:${color({genre:g,title:g})[0]}"></div></div></div>`).join("")})()}</div>
  </section>`;
}
function miniCard(b,i){const[bg,fg]=color(b);return `<button class="bk" style="background:${bg};color:${fg};aspect-ratio:auto;min-height:84px" onclick="openBook(${i})"><span class="t" style="font-size:13px">“${esc(b.title)}”</span><span class="m">${esc(b.author||"")}</span></button>`;}
function stat(v,l,h){return `<div class="stat"><div class="v">${v}</div><div class="kicker" style="margin-top:4px">${l}</div>${h?`<div style="font-size:12px;color:var(--muted);margin-top:3px">${h}</div>`:""}</div>`;}

function renderBiblioteca(){
  const chips=["todos","por_leer","leyendo","leido"];
  const list=BOOKS.map((b,i)=>({b,i})).filter(x=>{
    if(filterStatus!=="todos"&&x.b.status!==filterStatus)return false;
    if(searchQ){const h=(x.b.title+" "+(x.b.author||"")+" "+(x.b.genre||"")).toLowerCase();if(!h.includes(searchQ.toLowerCase()))return false;}
    return true;});
  return `<header><div class="kicker">${BOOKS.length} libros · toca uno para ver</div><h1 class="page">Biblioteca</h1></header>
  <div class="toolbar" style="margin-top:14px"><input class="search" placeholder="🔎 Buscar por título, autor, género…" value="${esc(searchQ)}" oninput="searchQ=this.value;rerenderInto()"/></div>
  <div class="chips">${chips.map(c=>`<button class="chip ${filterStatus===c?"active":""}" onclick="filterStatus='${c}';rerenderInto()">${c==="todos"?"Todos":STATUS[c].label} (${c==="todos"?BOOKS.length:BOOKS.filter(b=>b.status===c).length})</button>`).join("")}</div>
  <div class="grid books">${list.map(x=>bookCard(x.b,x.i)).join("")||'<p style="color:var(--muted)">Sin resultados.</p>'}</div>`;
}

function renderTablero(){
  const cols=[["por_leer","Por leer"],["leyendo","Leyendo"],["leido","Leído"]];
  return `<header><div class="kicker">Por leer · leyendo · leído</div><h1 class="page">Tablero</h1></header>
  <div class="kb" style="margin-top:16px">${cols.map(([s,l])=>{const items=BOOKS.map((b,i)=>({b,i})).filter(x=>x.b.status===s);
    return `<div class="col"><h3 style="color:${STATUS[s].color}">${l} · ${items.length}</h3>${items.map(x=>{const[bg,fg]=color(x.b);return `<div class="kcard" onclick="openBook(${x.i})"><div class="kc-cov" style="background:${bg};color:${fg}">“${esc(x.b.title).slice(0,22)}”</div><div><div style="font-size:13px;font-weight:600;line-height:1.15">${esc(x.b.title)}</div><div style="font-size:11px;color:var(--muted)">${esc(x.b.author||"")}</div></div></div>`;}).join("")||'<p style="color:var(--muted);font-size:13px">Vacío</p>'}</div>`;}).join("")}</div>`;
}

function renderHabito(){
  const set=new Set(READ_DAYS);const today="2026-06-13";
  const start=new Date(2026,0,1);const off=(start.getDay()+6)%7;const cur=new Date(2026,0,1-off);const end=new Date(2026,11,31);
  const weeks=[];while(cur<=end){const w=[];for(let i=0;i<7;i++){w.push(new Date(cur));cur.setDate(cur.getDate()+1);}weeks.push(w);}
  const toS=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const hm=weeks.map(w=>`<div class="wk">${w.map(d=>{const ds=toS(d);const inY=d.getFullYear()===2026;const fut=ds>today;const on=set.has(ds);return `<div class="cell ${!inY?"":on?"on":fut?"future":""}" title="${ds}" style="${!inY?"background:transparent":""}"></div>`;}).join("")}</div>`).join("");
  return `<header><div class="kicker">Marca los días que lees</div><h1 class="page">Hábito de lectura</h1></header>
  <div class="card" style="padding:24px;text-align:center;margin-top:16px">
    <p class="serif" style="font-size:18px;margin:0 0 12px">¿Leíste hoy?</p>
    <button class="btn fill" style="background:var(--accent);border-color:var(--accent)" onclick="this.textContent=this.textContent.includes('✅')?'📖 Marcar que leí hoy':'✅ ¡Leíste hoy!'">✅ ¡Leíste hoy!</button>
    <p style="color:var(--muted);font-size:13px;margin-top:10px">🔥 Racha actual: <b>13</b> días seguidos</p>
  </div>
  <div class="grid" style="grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px">
    ${stat(set.size,"Días leídos")}${stat("🔥 13","Racha actual")}${stat("🏆 19","Racha más larga")}${stat(13,"Este mes")}
  </div>
  <div class="card" style="padding:20px;margin-top:16px"><div class="hm">${hm}</div>
    <div style="text-align:right;font-size:11px;color:var(--muted);margin-top:8px">Menos <span class="cell" style="display:inline-block;vertical-align:middle"></span> <span class="cell on" style="display:inline-block;vertical-align:middle"></span> Más</div></div>`;
}

function renderEstadisticas(){
  const f=fictionPct();const gc=genreCounts();const max=Math.max(...gc.map(x=>x[1]),1);
  return `<header><div class="kicker">Tus hábitos de lectura</div><h1 class="page">Estadísticas</h1></header>
  <div class="grid" style="grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px">
    ${stat(BOOKS.length,"Libros")}${stat(BOOKS.filter(b=>b.status==="leido").length,"Leídos")}${stat(f+"%","% Ficción")}${stat("704","Páginas leídas")}</div>
  <div class="grid" style="grid-template-columns:1fr;gap:14px;margin-top:16px">
    <div class="card" style="padding:20px"><h3 class="serif">Ficción vs. No ficción</h3>
      <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
      <div class="donut" style="background:conic-gradient(var(--primary) 0 ${f}%, var(--soft) ${f}% 100%)"></div>
      <div class="legend"><span><span class="sw" style="background:var(--primary)"></span>Ficción ${f}%</span><span><span class="sw" style="background:var(--soft)"></span>No ficción ${100-f}%</span></div></div></div>
    <div class="card" style="padding:20px"><h3 class="serif">Libros por género</h3>
      ${(()=>{const total=gc.reduce((s,x)=>s+x[1],0)||1;let acc=0;const segs=gc.map(([g,n])=>{const a=acc/total*100;acc+=n;return `${color({genre:g,title:g})[0]} ${a}% ${acc/total*100}%`;}).join(",");const legend=gc.map(([g,n])=>`<span style="display:inline-flex;align-items:center;gap:6px"><span class="sw" style="background:${color({genre:g,title:g})[0]}"></span>${esc(g)} (${n})</span>`).join("");return `<div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap"><div class="donut" style="background:conic-gradient(${segs})"></div><div style="display:flex;flex-direction:column;gap:7px;font-size:13px">${legend}</div></div>`;})()}</div>
  </div>`;
}

let quizStep=0;const QUIZ=[{q:"¿Cómo te sientes hoy?",o:["Evadirme y soñar","Aprender algo nuevo","Emoción y tensión","Algo reconfortante"]},{q:"¿Ficción o realidad?",o:["Ficción","No ficción","Me da igual"]},{q:"¿Qué ritmo te apetece?",o:["Trepidante","Pausado","Equilibrado"]},{q:"¿Cuánto tiempo tienes?",o:["Poco","Bastante","Lo que sea"]},{q:"¿Tema que te llame?",o:["Crecimiento personal","Mente y cerebro","Sociedad","Sorpréndeme"]}];
function renderRecomendar(){
  if(quizStep>=QUIZ.length){const recs=BOOKS.filter(b=>b.status==="por_leer").slice(0,3);
    return `<header style="text-align:center"><div class="kicker">Recomiéndame</div><h1 class="page">Tus 3 recomendaciones</h1></header>
    <div class="rec" style="margin-top:18px">${recs.map((b,k)=>{const[bg,fg]=color(b);return `<div class="card" style="padding:18px"><div style="font-size:28px">${["🥇","🥈","🥉"][k]}</div><div class="serif" style="font-size:18px;margin-top:6px">${esc(b.title)}</div><div style="font-size:13px;color:var(--muted)">${esc(b.author||"")}</div><span style="display:inline-block;margin-top:8px;font-size:11px;background:var(--soft);color:var(--maroon);padding:2px 8px;border-radius:999px">📚 En tu biblioteca</span><p style="font-size:14px;margin-top:10px">Encaja con lo que buscas hoy: una lectura que conecta con tu ánimo y tus temas favoritos.</p></div>`;}).join("")}</div>
    <div style="text-align:center;margin-top:18px"><button class="btn ghost" onclick="quizStep=0;rerenderInto()">🔄 Volver a empezar</button></div>`;}
  const cur=QUIZ[quizStep];
  return `<header style="text-align:center"><div class="kicker">Recomiéndame</div><h1 class="page">¿Qué leo ahora?</h1></header>
  <div style="max-width:520px;margin:18px auto 0"><div style="display:flex;gap:6px;margin-bottom:14px">${QUIZ.map((_,i)=>`<div style="height:6px;flex:1;border-radius:99px;background:${i<=quizStep?"var(--primary)":"var(--border)"}"></div>`).join("")}</div>
  <div class="card" style="padding:22px"><div class="kicker">Pregunta ${quizStep+1} de ${QUIZ.length}</div><h2 class="serif" style="margin:6px 0 16px;font-size:22px">${cur.q}</h2>
  ${cur.o.map(o=>`<button class="qopt" onclick="quizStep++;rerenderInto()">${o}</button>`).join("")}</div></div>`;
}

function renderAgregar(){
  return `<header><div class="kicker">Nuevo libro</div><h1 class="page">Agregar</h1><p style="color:var(--muted)">Por foto de la portada, por título o manualmente. La IA propone los datos y tú confirmas.</p></header>
  <div class="chips" style="margin-top:14px"><button class="chip active">📷 Por foto de portada</button><button class="chip">🔎 Por título</button><button class="chip">✍️ Manual</button></div>
  <div class="card" style="padding:24px;border-style:dashed;text-align:center"><p style="color:var(--muted)">Sube o toma una foto de la portada. La IA detectará el libro y rellenará los datos para que los revises antes de guardar.</p>
  <button class="btn fill" style="margin-top:10px">Elegir imagen</button><p class="kicker" style="margin-top:12px">(En el prototipo esto es solo visual)</p></div>`;
}

const RENDER={inicio:renderInicio,biblioteca:renderBiblioteca,agregar:renderAgregar,tablero:renderTablero,habito:renderHabito,estadisticas:renderEstadisticas,recomendar:renderRecomendar};
function rerenderInto(){document.getElementById("content").innerHTML=RENDER[current]();drawPins();}
function go(p){current=p;quizStep= p==="recomendar"?0:quizStep;window.scrollTo(0,0);buildNav();rerenderInto();}

function buildNav(){document.getElementById("navlinks").innerHTML=PAGES.map(([id,l])=>`<li><button class="${current===id?"active":""}" onclick="go('${id}')">${l}</button></li>`).join("");}

/* ---- book detail ---- */
function openBook(i){const b=BOOKS[i];const[bg,fg]=color(b);const s=STATUS[b.status];
  const o=document.createElement("div");o.className="overlay";o.onclick=e=>{if(e.target===o)o.remove();};
  o.innerHTML=`<div class="panel"><div class="ph"><h2 class="serif" style="margin:0">Detalle</h2><button class="x" onclick="this.closest('.overlay').remove()">×</button></div>
   <div class="pb"><div style="display:flex;gap:16px">
     <div class="bigcover" style="background:${bg};color:${fg}"><span class="serif" style="font-size:14px">“${esc(b.title)}”</span><span class="m" style="font-family:var(--mono);font-size:9px;opacity:.8">${esc(b.author||"")}</span></div>
     <div><h3 class="serif" style="font-size:20px;margin:0">${esc(b.title)}</h3><div style="color:var(--muted)">${esc(b.author||"")}</div>
       <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">${b.is_fiction!=null?`<span style="font-size:11px;background:var(--soft);color:var(--maroon);padding:2px 8px;border-radius:99px">${b.is_fiction?"Ficción":"No ficción"}</span>`:""}${b.genre?`<span style="font-size:11px;background:var(--soft);color:var(--maroon);padding:2px 8px;border-radius:99px">${esc(b.genre)}</span>`:""}</div>
       <div style="margin-top:10px;color:#e0a">★★★★☆</div></div></div>
     <div><div class="kicker">Estado de lectura</div><div class="statusbtns" style="margin-top:6px">
       ${Object.entries(STATUS).map(([k,v])=>`<button style="${b.status===k?`background:${v.color};color:#fff;border-color:transparent`:""}">${v.label}</button>`).join("")}</div></div>
     <div><div class="kicker">Sinopsis</div><p style="font-size:14px">Aquí iría la sinopsis del libro (la IA la completa al agregarlo).</p></div>
     <div style="display:flex;gap:10px"><button class="btn fill">✏️ Editar</button><button class="btn ghost" style="border-color:#c66;color:#c33">🗑 Borrar</button></div>
   </div></div>`;
  document.body.appendChild(o);
}

/* ---- ANNOTATIONS ---- */
let annotating=false;
let annotations=JSON.parse(localStorage.getItem("bc_annot")||"[]");
function saveAnn(){localStorage.setItem("bc_annot",JSON.stringify(annotations));document.getElementById("annCount").textContent=annotations.length;document.getElementById("btnList").style.display=annotations.length?"block":"none";}
function pageName(id){return (PAGES.find(p=>p[0]===id)||["",id])[1];}
function drawPins(){
  const layer=document.getElementById("annLayer");layer.style.height=document.body.scrollHeight+"px";
  layer.innerHTML=annotations.filter(a=>a.page===current).map((a)=>{const idx=annotations.indexOf(a)+1;return `<div class="pin" style="left:${a.x}px;top:${a.y}px" title="${esc(a.text)}" onclick="viewPin(${annotations.indexOf(a)})">${idx}</div>`;}).join("");
}
function viewPin(i){alert("Anotación "+(i+1)+":\n"+annotations[i].text);}
document.getElementById("btnAnnotate").onclick=function(){annotating=!annotating;document.body.classList.toggle("annotating",annotating);this.textContent="✎ Anotar: "+(annotating?"ON":"OFF");this.className="annbtn "+(annotating?"on":"off");};
document.getElementById("content").addEventListener("click",function(e){
  if(!annotating)return;
  if(e.target.closest(".editpop"))return;
  e.preventDefault();e.stopPropagation();
  const x=e.pageX, y=e.pageY;
  document.querySelectorAll(".editpop").forEach(p=>p.remove());
  const pop=document.createElement("div");pop.className="editpop";pop.style.left=x+"px";pop.style.top=y+"px";
  pop.innerHTML=`<textarea placeholder="¿Qué cambiar aquí?"></textarea><div class="row"><button style="background:var(--soft)" onclick="this.closest('.editpop').remove()">Cancelar</button><button style="background:var(--primary);color:#fff" onclick="addAnn(this,${x},${y})">Guardar</button></div>`;
  document.body.appendChild(pop);pop.querySelector("textarea").focus();
},true);
function addAnn(btn,x,y){const t=btn.closest(".editpop").querySelector("textarea").value.trim();btn.closest(".editpop").remove();if(!t)return;annotations.push({page:current,x,y,text:t,when:new Date().toISOString().slice(0,16).replace("T"," ")});saveAnn();drawPins();}
function toggleAnnPanel(show){const p=document.getElementById("annPanel");p.style.display=show?"flex":"none";if(show)renderAnnList();}
document.getElementById("btnList").onclick=()=>toggleAnnPanel(true);
function renderAnnList(){document.getElementById("annList").innerHTML=annotations.length?annotations.map((a,i)=>`<div class="anrow"><div><span class="tag">#${i+1} · ${pageName(a.page)}</span><div>${esc(a.text)}</div></div><button class="x" onclick="annotations.splice(${i},1);saveAnn();renderAnnList();drawPins()">×</button></div>`).join(""):'<p style="color:var(--muted)">Aún no hay anotaciones. Activa “Anotar” y toca sobre la pantalla.</p>';}
function copyAnnotations(){if(!annotations.length){alert("No hay anotaciones todavía.");return;}
  const txt="Anotaciones de bookclub de sara:\n\n"+annotations.map((a,i)=>`${i+1}. [${pageName(a.page)}] ${a.text}`).join("\n");
  navigator.clipboard.writeText(txt).then(()=>alert("¡Copiado! Pega el texto en el chat con Clau.")).catch(()=>{prompt("Copia este texto y pégalo en el chat:",txt);});}
function clearAnnotations(){if(confirm("¿Borrar todas las anotaciones?")){annotations=[];saveAnn();renderAnnList();drawPins();}}

/* init */
buildNav();rerenderInto();saveAnn();
window.addEventListener("resize",drawPins);
</script>
</body>
</html>
